directories:
  output: release
  buildResources: public
appId: com.yhsdaniel.chageescraper
productName: Chagee Scraper App
artifactName: CHAGEE-Scraper-Setup-${version}.${ext}
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
extraResources:
  - from: python/project1/
    to: python/project1/
    filter:
      - '**/*'
      - '!venv/Lib/site-packages/**/tests/**/*'
      - '!venv/Lib/site-packages/**/__pycache__/**/*'
  - from: python/project2/
    to: python/project2/
    filter:
      - '**/*'
asar: true
compression: maximum
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CHAGEE Scraper
publish:
  provider: github
  owner: yhsdaniel
  repo: chagee-scraper
  private: false
  releaseType: release
electronVersion: 31.7.7
