name: Build CHAGEE Scraper

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger only when you push v1.0.0, v1.0.1 etc

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: |
          Get-ChildItem -Directory "python" | ForEach-Object {
            $req = Join-Path $_.FullName "requirements.txt"
            if (Test-Path $req) {
              Write-Host "Installing for $($_.Name)"
              Push-Location $_.FullName
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              Pop-Location
            }
          }
          python -m playwright install chromium

      - name: Build Web + Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAGEE-Scraper-Windows
          path: release/*.exe